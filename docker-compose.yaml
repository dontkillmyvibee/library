services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: library-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  postgres-migrate:
    image: migrate/migrate:v4.20.1
    container_name: migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: pg-port-forwarder
    command:
      - tcp-listen:${POSTGRES_PORT},fork,reuseaddr
      - tcp-connect:postgres:${POSTGRES_PORT}
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:5432"


volumes:
  postgres_data:

